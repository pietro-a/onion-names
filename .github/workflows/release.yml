name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tagged version
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged version
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "Release tag must use stable semantic version format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 node --check

      - name: Run unit tests
        run: node --test

      - name: Validate manifest and referenced files
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const references = [
            ...Object.values(manifest.icons || {}),
            manifest.action?.default_icon,
            manifest.options_ui?.page,
            ...(manifest.background?.scripts || []),
            ...(manifest.content_scripts || []).flatMap((entry) => [
              ...(entry.js || []),
              ...(entry.css || []),
            ]),
            ...(manifest.web_accessible_resources || []).flatMap((entry) =>
              entry.resources || [],
            ),
          ].filter(Boolean);

          const missing = references.filter((file) => !fs.existsSync(path.resolve(file)));

          if (missing.length > 0) {
            console.error("Manifest references missing files:");
            for (const file of missing) console.error(`- ${file}`);
            process.exit(1);
          }

          console.log(`Manifest is valid; checked ${references.length} file reference(s).`);
          NODE

  publish:
    name: Package and publish release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged version
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Prepare release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir dist
          cp -R manifest.json README.md LICENSE icons js options dist/

          jq --arg version "$VERSION" '.version = $version' \
            dist/manifest.json > dist/manifest.tmp
          mv dist/manifest.tmp dist/manifest.json

          PACKAGE_VERSION="$(jq -r '.version' dist/manifest.json)"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Packaged manifest version ($PACKAGE_VERSION) does not match tag version ($VERSION)"
            exit 1
          fi

          PACKAGE="onion-names-v${VERSION}.zip"
          (cd dist && zip -r "../$PACKAGE" manifest.json README.md LICENSE icons js options)

          echo "Created $PACKAGE with manifest version $PACKAGE_VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: onion-names-${{ github.ref_name }}.zip
